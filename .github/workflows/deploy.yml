name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not to version tags. A tag is mutable:
      # whoever controls the action's repo can move `v4` to point at new code,
      # which would then run here with the contents:write token below. The
      # trailing comment records the human-readable version each SHA is.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # /work queries the GitHub search API at build time for its upstream
          # rail (it was the /contributions page until 2026-10-26; the token is
          # still required, only the page name changed).
          # Unauthenticated it is 10 req/min against a per-IP pool that Actions
          # runners share, so CI would intermittently 403 and publish an empty
          # page. This token is build-only and never reaches the browser.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages
        # Third-party, so the one that most warrants a SHA pin.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
